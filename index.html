<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Whatever</title>

    <!-- PWA：添加到桌面后的名字与图标 -->
    <meta name="application-name" content="Whatever">
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Whatever">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/IMG_20261008_161846.jpg">
    <link rel="apple-touch-icon" href="assets/IMG_20261008_161846.jpg">
    <link rel="preload" as="image" href="assets/ovo.png">
    
    <!-- 引入 CSS 样式 -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/desktop.css">
    <link rel="stylesheet" href="css/app-icon.css">
    <link rel="stylesheet" href="css/widgets.css">
    <link rel="stylesheet" href="css/app-window.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/messages.css">
    <link rel="stylesheet" href="css/photo-loader.css">
    <link rel="stylesheet" href="css/archangel.css">
    <link rel="stylesheet" href="css/worldbook.css">
    <link rel="stylesheet" href="css/preset.css">
    <link rel="stylesheet" href="css/world.css">
    <script>
        // 注册 Service Worker（添加到桌面需要它；需要通过 https 或 localhost 访问）
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service Worker 注册失败:', err));
            });
        }
    </script>
    <link rel="stylesheet" href="css/widget-kit.css">
</head>
<body>
    <!-- 开场加载：背景 ovo.png + 灰框文字 + 进度条；支持配置照片及从存储中自动读取真实照片 -->
    <script>
        // 要等待加载的照片列表，自动包含预设与存储中的相册照片
        window.PHOTO_LIST = window.PHOTO_LIST || [
            'assets/ovo.png',
            'assets/IMG_20261008_161846.jpg'
        ];
    </script>
    <script src="js/data/storage-migrate.js"></script>
    <script src="js/photo-loader.js"></script>

    <div class="phone-container" id="phoneContainer">

        <!-- visionOS 空间计算级微晶折射滤镜 -->
        <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
            <filter id="lens-refraction" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </svg>

        <!-- 隐藏的图片文件上传通道 -->
        <input type="file" id="avatarFileInput" accept="image/*" style="display: none;">
        <input type="file" id="coupleAvatarInput" accept="image/*" style="display: none;">

        <!-- 桌面主屏幕 -->
        <div class="home-screen" id="homeScreen">
            
            <!-- 多页横向滑动视口 (柔和减速翻页) -->
            <div class="desktop-viewport" id="desktopViewport">
                <div class="desktop-track" id="desktopTrack"></div>
            </div>

            <!-- 浅色分页圆点 + 长按出现的加号 (+) 栏 -->
            <div class="pagination-bar">
                <div class="pagination-inner">
                    <div class="dots-container" id="dotsContainer"></div>
                    <button class="add-page-btn" id="addPageBtn" title="新建桌面页面">+</button>
                    <button class="remove-page-btn" id="removePageBtn" title="删除最后一页">−</button>
                </div>
            </div>

            <!-- 无色彩倾向中性灰 Dock 栏 -->
            <div class="dock-wrapper">
                <div class="dock" id="dockBar"></div>
            </div>

        </div>

        <!-- App 打开界面全屏容器 -->
        <div class="app-window" id="appWindow">
            <header class="app-header">
                <div class="app-header-title" id="appTitle">应用名称</div>
            </header>
            <main class="app-content">
            </main>
            <div class="home-indicator-area" onclick="closeApp()">
                <div class="home-indicator"></div>
            </div>
        </div>

    </div>

    <!-- 引入 JS 脚本 (严格按照依赖顺序) -->
    <script src="js/db.js"></script>
    <script src="js/desktop.js"></script>
    <script src="js/apps/settings.js"></script>
    <script src="js/apps/quick-cruise.js"></script>
    <script src="js/apps/messages-api.js"></script>
    <script src="js/apps/messages-markup.js"></script>
    <script src="js/apps/messages.js"></script>
    <script src="js/apps/archangel.js"></script>
    <script src="js/apps/worldbook.js"></script>
    <script src="js/apps/world.js"></script>
    <script src="js/apps/preset.js"></script>
    <script src="js/apps/app-manager.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
