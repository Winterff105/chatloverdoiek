    <!-- iOS 真实视口高度修正 + 壁纸同步到 html 兜底层 -->
    <script>
        (function() {
            var root = document.documentElement;

            function isStandalone() {
                return window.navigator.standalone === true ||
                    window.matchMedia('(display-mode: standalone)').matches;
            }

            // Let Android resize the app shell naturally when the keyboard
            // opens. Only the standalone iOS screen-height workaround remains;
            // the chat keyboard adapter compensates when native resize cannot.
            function setAppHeight() {
                var h = window.innerHeight;
                if (isStandalone()) {
                    var landscape = window.innerWidth > window.innerHeight;
                    var screenH = landscape
                        ? Math.min(screen.width, screen.height)
                        : Math.max(screen.width, screen.height);
                    h = Math.max(h, screenH);
                }
                if (root.style.getPropertyValue('--app-height') !== h + 'px') {
                    root.style.setProperty('--app-height', h + 'px');
                }
            }

            // 把 phone-container 上的壁纸变量复制到 html，让 html/body 背景层也显示壁纸
            var lastBg = '';
            var lastTint = '';
            function syncWallpaper() {
                var pc = document.getElementById('phoneContainer');
                if (!pc) return;
                var bg = getComputedStyle(pc).getPropertyValue('--wallpaper-bg').trim();
                if (bg && bg !== lastBg) {
                    lastBg = bg;
                    root.style.setProperty('--wallpaper-bg-root', bg);
                }
                // 状态栏取色：深色壁纸用深色，浅色壁纸用浅色
                // iOS 26 Safari 读取 html/body 背景色，iOS 15~18 读取 theme-color
                var tint = pc.classList.contains('theme-light') ? '#FCFAFB' : '#09090b';
                if (tint !== lastTint) {
                    lastTint = tint;
                    root.style.setProperty('--status-tint', tint);
                    var meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) meta.setAttribute('content', tint);
                }
            }

            setAppHeight();
            window.addEventListener('resize', setAppHeight);
            window.addEventListener('orientationchange', function() {
                setTimeout(setAppHeight, 300);
            });

            document.addEventListener('DOMContentLoaded', function() {
                setAppHeight();
                syncWallpaper();
                var pc = document.getElementById('phoneContainer');
                var observer = new MutationObserver(syncWallpaper);
                if (pc) {
                    observer.observe(pc, { attributes: true, attributeFilter: ['style', 'class'] });
                }
                observer.observe(document.body, { attributes: true, attributeFilter: ['style', 'class'] });
                // 壁纸可能由异步脚本稍后写入，再补几次同步
                setTimeout(syncWallpaper, 500);
                setTimeout(syncWallpaper, 1500);
                setTimeout(syncWallpaper, 3000);
            });
        })();
    </script>

    <script>
        // 记录已经注入过的文件，重复调用时跳过，避免 "already declared" 报错
        window.__loadedCoreScripts = window.__loadedCoreScripts || new Set();

        window.__appBootstrap = async function(token) {
            // 受保护的样式：顺序与原来 <link> 的顺序一致，后面的会覆盖前面的
            const styles = [
                'css/base.css',
                'css/desktop.css',
                'css/app-icon.css',
                'css/widgets.css',
                'css/app-window.css',
                'css/settings.css',
                'css/messages.css',
                'css/archangel.css',
                'css/worldbook.css',
                'css/preset.css',
                'css/world.css',
                'css/liquid-glass.css',
                'css/backup.css',
                'css/widget-kit.css'
            ];

            const scripts = [
                'js/db.js',
                'js/desktop.js',
                'js/apps/settings.js',
                'js/apps/quick-cruise.js',
                'js/apps/messages-api.js',
                'js/apps/messages-markup.js',
                'js/apps/messages.js',
                'js/apps/archangel.js',
                'js/apps/worldbook.js',
                'js/apps/world.js',
                'js/liquid-glass.js',
                'js/apps/preset.js',
                'js/apps/backup.js',
                'js/apps/app-manager.js',
                'js/main.js'
            ];

            const needStyles = styles.filter(f => !window.__loadedCoreScripts.has(f));
            const needScripts = scripts.filter(f => !window.__loadedCoreScripts.has(f));
            const needFiles = needStyles.concat(needScripts);

            // 一次请求拿到全部核心文件；网络抖动时自动重试，最多 3 次；401/403 不重试，直接交给门禁处理
            async function fetchBundle() {
                let lastErr = null;
                for (let i = 0; i < 3; i++) {
                    try {
                        const res = await fetch('/api/protected-bundle', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            cache: 'no-store',
                            body: JSON.stringify({ token, files: needFiles })
                        });
                        if (res.ok) {
                            const out = await res.json();
                            if (out && out.success && out.files) return out.files;
                            throw new Error((out && out.message) || '核心文件返回格式错误');
                        }
                        const detail = (await res.text()).slice(0, 120);
                        const err = new Error(`核心文件返回 ${res.status}：${detail}`);
                        err.status = res.status;
                        if (res.status === 401 || res.status === 403) throw err;
                        lastErr = err;
                    } catch (e) {
                        if (e && (e.status === 401 || e.status === 403)) throw e;
                        lastErr = e;
                    }
                    console.warn('[Core] Request failed, retrying…', i + 1);
                    await new Promise(r => setTimeout(r, 800 * (i + 1)));
                }
                throw lastErr;
            }

            // 任何一个文件缺失就整体报错，不注入任何东西
            const t0 = Date.now();
            const files = needFiles.length ? await fetchBundle() : {};
            const missing = needFiles.filter(f => typeof files[f] !== 'string');
            if (missing.length) throw new Error('核心文件缺失：' + missing.join(', '));
            const cssTexts = needStyles.map(f => files[f]);
            const jsTexts = needScripts.map(f => files[f]);
            console.log('[Core] Downloaded…', needStyles.length + needScripts.length, 'files in', Date.now() - t0, 'ms');

            // 1. 按顺序注入样式
            needStyles.forEach((href, i) => {
                // 原文件在 css/ 目录下，url('../assets/...') 内联到页面后要改成 url('assets/...')
                const css = cssTexts[i].replace(/url\(\s*(['"]?)\.\.\//g, 'url($1');
                const style = document.createElement('style');
                style.dataset.src = href;
                style.textContent = css;
                document.head.appendChild(style);
                window.__loadedCoreScripts.add(href);
                console.log('[Style] Injected…', href, 'size =', css.length);
            });

            // 2. 按顺序注入脚本
            needScripts.forEach((src, i) => {
                const script = document.createElement('script');
                let contents = jsTexts[i];
                if (src === 'js/apps/messages.js') {
                    const anchor = 'window.initMessagesModule = function(root) {';
                    if (contents.includes(anchor)) {
                        contents = contents.replace(anchor, anchor + '\n' + window.__wmcAdapterSource);
                    } else console.warn('[Music] Chat module layout changed; integration disabled');
                    const inviteAnchor = 'if (m.photo) { html += photoMsgHtml(m, i, c, avo); continue; }';
                    if (contents.includes(inviteAnchor)) {
                        contents = contents.replace(inviteAnchor, window.__wmcCardSource + '\n' + inviteAnchor);
                    } else console.warn('[Music] Invite card renderer changed; text fallback remains');
                    // Use the EXISTING common-memory fold for music conversations,
                    // instead of rendering one message per turn in the chat room.
                    const foldAnchor = "x.kind === 'shot' ?";
                    if(contents.includes(foldAnchor)){
                        contents=contents.replace(foldAnchor,"(x.kind === 'shot' || x.kind === 'music-listen') ?");
                    } else console.warn('[Music] Common memory renderer changed; music entries will still remain saved');
                }
                script.textContent = contents;
                document.head.appendChild(script);
                window.__loadedCoreScripts.add(src);
                console.log('[Core] Injected…', src, 'size =', jsTexts[i].length);
            });

            // 核心脚本是页面加载完之后才注入的，这里手动派发一次初始化事件
            if (needScripts.length > 0 && !window.__coreInitDispatched) {
                window.__coreInitDispatched = true;
                console.log('[Core] Booting desktop…');
                document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true }));
                window.dispatchEvent(new Event('load'));
                console.log('[Core] Boot events dispatched…');
            }
        };
    </script>

<script src="js/update-manager.js" defer></script>
<script>
(function() {
    const loadScreen = document.getElementById('appLoadingScreen');
    const loadText = document.getElementById('appLoadText');
    // 更新组件独立由 update-manager.js 处理。

    // 本地有登录凭证：说明之前登录过，加载期间不露出登录页
    let hasSavedAuth = false;
    try {
        const saved = JSON.parse(localStorage.getItem('whatever_phone_auth') || 'null');
        hasSavedAuth = !!(saved && saved.qq && saved.token);
    } catch (e) {
        hasSavedAuth = false;
    }

    let loadingHidden = false;
    let checkReady = null;
    let fallbackTimer = null;

    // 隐藏加载页（只执行一次）
    function hideLoading() {
        if (loadingHidden) return;
        loadingHidden = true;
        if (checkReady) clearInterval(checkReady);
        if (fallbackTimer) clearTimeout(fallbackTimer);
        if (loadScreen) {
            loadScreen.style.opacity = '0';
            loadScreen.style.pointerEvents = 'none';
            setTimeout(() => loadScreen.remove(), 600);
        }
    }

    // 门禁脚本在自动登录失败时调用，露出登录页
    window.__hideAppLoading = hideLoading;

    checkReady = setInterval(() => {
        const gate = document.getElementById('sanctuaryGatePortal');

        // 门禁脚本已标记需要手动登录（凭证失效或网络失败）
        if (window.__gateNeedsLogin) {
            hideLoading();
            return;
        }

        // 没登录过：门禁出现后就关掉加载页，让用户登录
        if (!hasSavedAuth && gate) {
            hideLoading();
            return;
        }

        // 登录过：等门禁解锁（开始淡出或已移除）后再关掉加载页，直接进桌面
        if (!gate || gate.classList.contains('unlocked')) {
            hideLoading();
        }
    }, 200);

    // 兜底：30 秒后强制隐藏，避免网络极差时卡在加载页
    fallbackTimer = setTimeout(hideLoading, 30000);

    // 更新加载文字
    if (loadText) {
        if (hasSavedAuth) {
            loadText.textContent = 'Restoring session...';
            setTimeout(() => { if (!loadingHidden) loadText.textContent = 'Loading core modules...'; }, 1500);
            setTimeout(() => { if (!loadingHidden) loadText.textContent = 'Almost ready...'; }, 4000);
            setTimeout(() => { if (!loadingHidden) loadText.textContent = 'Slow network, still loading...'; }, 9000);
        } else {
            setTimeout(() => { if (!loadingHidden) loadText.textContent = 'Loading core modules...'; }, 1000);
            setTimeout(() => { if (!loadingHidden) loadText.textContent = 'Almost ready...'; }, 3000);
        }
    }
})();
</script>
