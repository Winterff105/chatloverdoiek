    <!-- iOS 真实视口高度修正 + 壁纸同步到 html 兜底层 -->
    <script>
        (function() {
            var root = document.documentElement;

            function isStandalone() {
                return window.navigator.standalone === true ||
                    window.matchMedia('(display-mode: standalone)').matches;
            }

            // 主屏幕模式下 innerHeight 会少算状态栏高度，改取物理屏幕高度
            function setAppHeight() {
                var h = window.innerHeight;
                if (isStandalone()) {
                    var landscape = window.innerWidth > window.innerHeight;
                    var screenH = landscape
                        ? Math.min(screen.width, screen.height)
                        : Math.max(screen.width, screen.height);
                    h = Math.max(h, screenH);
                }
                root.style.setProperty('--app-height', h + 'px');
            }

            // 把 phone-container 上的壁纸变量复制到 html，让 html/body 背景层也显示壁纸
            var lastBg = '';
            var lastTint = '';
            function syncWallpaper() {
                var pc = document.getElementById('phoneContainer');
                if (!pc) return;
                var bg = getComputedStyle(pc).getPropertyValue('--wallpaper-bg').trim();
                if (bg && bg !== lastBg) {
                    lastBg = bg;
                    root.style.setProperty('--wallpaper-bg-root', bg);
                }
                // 状态栏取色：深色壁纸用深色，浅色壁纸用浅色
                // iOS 26 Safari 读取 html/body 背景色，iOS 15~18 读取 theme-color
                var tint = pc.classList.contains('theme-light') ? '#FCFAFB' : '#09090b';
                if (tint !== lastTint) {
                    lastTint = tint;
                    root.style.setProperty('--status-tint', tint);
                    var meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) meta.setAttribute('content', tint);
                }
            }

            setAppHeight();
            window.addEventListener('resize', setAppHeight);
            window.addEventListener('orientationchange', function() {
                setTimeout(setAppHeight, 300);
            });

            document.addEventListener('DOMContentLoaded', function() {
                setAppHeight();
                syncWallpaper();
                var pc = document.getElementById('phoneContainer');
                var observer = new MutationObserver(syncWallpaper);
                if (pc) {
                    observer.observe(pc, { attributes: true, attributeFilter: ['style', 'class'] });
                }
                observer.observe(document.body, { attributes: true, attributeFilter: ['style', 'class'] });
                // 壁纸可能由异步脚本稍后写入，再补几次同步
                setTimeout(syncWallpaper, 500);
                setTimeout(syncWallpaper, 1500);
                setTimeout(syncWallpaper, 3000);
            });
        })();
    </script>

    <script>
        // 注册 Service Worker（添加到桌面需要它；需要通过 https 或 localhost 访问）
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // 核心脚本加载后会再派发一次 load 事件，这里防止重复注册
                if (window.__swRegistered) return;
                window.__swRegistered = true;

                // updateViaCache: 'none'：检查更新时不读 HTTP 缓存，iOS 才能及时拿到新的 sw.js
                navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
                    .then(reg => {
                        // iOS 主屏幕模式经常不冷启动，切回前台时主动检查一次更新
                        document.addEventListener('visibilitychange', () => {
                            if (document.visibilityState === 'visible') {
                                reg.update().catch(() => {});
                            }
                        });
                    })
                    .catch(err => console.warn('Service Worker 注册失败:', err));
            });
        }

        // 一键更新：清空所有 SW 缓存，检查新版 SW，然后刷新页面
        window.__applyUpdate = async function() {
            try {
                if ('caches' in window) {
                    const keys = await caches.keys();
                    await Promise.all(keys.map(k => caches.delete(k)));
                }
                if ('serviceWorker' in navigator) {
                    const reg = await navigator.serviceWorker.getRegistration();
                    if (reg) await reg.update();
                }
            } catch (e) {
                console.warn('[Update] 清理缓存失败，直接刷新', e);
            }
            location.reload();
        };
    </script>

    <script>
        // 记录已经注入过的文件，重复调用时跳过，避免 "already declared" 报错
        window.__loadedCoreScripts = window.__loadedCoreScripts || new Set();

        window.__appBootstrap = async function(token) {
            // 受保护的样式：顺序与原来 <link> 的顺序一致，后面的会覆盖前面的
            const styles = [
                'css/base.css',
                'css/desktop.css',
                'css/app-icon.css',
                'css/widgets.css',
                'css/app-window.css',
                'css/settings.css',
                'css/messages.css',
                'css/archangel.css',
                'css/worldbook.css',
                'css/preset.css',
                'css/world.css',
                'css/liquid-glass.css',
                'css/backup.css',
                'css/widget-kit.css'
            ];

            const scripts = [
                'js/db.js',
                'js/desktop.js',
                'js/apps/settings.js',
                'js/apps/quick-cruise.js',
                'js/apps/messages-api.js',
                'js/apps/messages-markup.js',
                'js/apps/messages.js',
                'js/apps/archangel.js',
                'js/apps/worldbook.js',
                'js/apps/world.js',
                'js/liquid-glass.js',
                'js/apps/preset.js',
                'js/apps/backup.js',
                'js/apps/app-manager.js',
                'js/main.js'
            ];

            // 网络抖动时自动重试，最多 3 次；401/403 不重试，直接交给门禁处理
            async function fetchFile(file) {
                const url = `/api/protected-js?file=${encodeURIComponent(file)}&token=${encodeURIComponent(token)}`;
                let lastErr = null;
                for (let i = 0; i < 3; i++) {
                    try {
                        const res = await fetch(url, { cache: 'no-store' });
                        if (res.ok) return await res.text();
                        const detail = (await res.text()).slice(0, 120);
                        const err = new Error(`${file} 返回 ${res.status}：${detail}`);
                        err.status = res.status;
                        if (res.status === 401 || res.status === 403) throw err;
                        lastErr = err;
                    } catch (e) {
                        if (e && (e.status === 401 || e.status === 403)) throw e;
                        lastErr = e;
                    }
                    console.warn('[Core] Request failed, retrying…', i + 1, file);
                    await new Promise(r => setTimeout(r, 800 * (i + 1)));
                }
                throw lastErr;
            }

            const needStyles = styles.filter(f => !window.__loadedCoreScripts.has(f));
            const needScripts = scripts.filter(f => !window.__loadedCoreScripts.has(f));

            // 所有文件同时下载；任何一个失败就整体报错，不注入任何东西
            const t0 = Date.now();
            const [cssTexts, jsTexts] = await Promise.all([
                Promise.all(needStyles.map(fetchFile)),
                Promise.all(needScripts.map(fetchFile))
            ]);
            console.log('[Core] Downloaded…', needStyles.length + needScripts.length, 'files in', Date.now() - t0, 'ms');

            // 1. 按顺序注入样式
            needStyles.forEach((href, i) => {
                // 原文件在 css/ 目录下，url('../assets/...') 内联到页面后要改成 url('assets/...')
                const css = cssTexts[i].replace(/url\(\s*(['"]?)\.\.\//g, 'url($1');
                const style = document.createElement('style');
                style.dataset.src = href;
                style.textContent = css;
                document.head.appendChild(style);
                window.__loadedCoreScripts.add(href);
                console.log('[Style] Injected…', href, 'size =', css.length);
            });

            // 2. 按顺序注入脚本
            needScripts.forEach((src, i) => {
                const script = document.createElement('script');
                script.textContent = jsTexts[i];
                document.head.appendChild(script);
                window.__loadedCoreScripts.add(src);
                console.log('[Core] Injected…', src, 'size =', jsTexts[i].length);
            });

            // 核心脚本是页面加载完之后才注入的，这里手动派发一次初始化事件
            if (needScripts.length > 0 && !window.__coreInitDispatched) {
                window.__coreInitDispatched = true;
                console.log('[Core] Booting desktop…');
                document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true }));
                window.dispatchEvent(new Event('load'));
                console.log('[Core] Boot events dispatched…');
            }
        };
    </script>

<script>
(function() {
    const loadScreen = document.getElementById('appLoadingScreen');
    const loadText = document.getElementById('appLoadText');
    const updateToast = document.getElementById('appUpdateToast');
    const updateModal = document.getElementById('appUpdateModal');

    // 监听 Service Worker 发来的"新版本"消息
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', e => {
            if (e.data && e.data.type === 'NEW_VERSION') {
                // 弹出更新提示
                if (updateToast) updateToast.style.transform = 'translateX(-50%) translateY(0)';
            }
        });
    }

    // 点击底栏更新提示时打开详情弹窗（可选）
    if (updateToast) {
        updateToast.addEventListener('click', e => {
            if (e.target.tagName !== 'BUTTON' && updateModal) {
                updateModal.style.display = 'flex';
            }
        });
    }

    // 页面加载完后隐藏加载页
    function hideLoading() {
        if (loadScreen) {
            loadScreen.style.opacity = '0';
            setTimeout(() => loadScreen.remove(), 600);
        }
    }

    // 等待门禁解锁或核心模块加载完成
    const checkReady = setInterval(() => {
        const gate = document.getElementById('sanctuaryGatePortal');
        const desktop = document.getElementById('phoneContainer');
        // 门禁消失、或桌面已经显示，说明加载完了
        if (!gate || (desktop && getComputedStyle(desktop).display !== 'none')) {
            clearInterval(checkReady);
            hideLoading();
        }
    }, 200);

    // 兜底：10 秒后强制隐藏，避免卡在加载页
    setTimeout(hideLoading, 10000);

    // 更新加载文字（可选）
    if (loadText) {
        setTimeout(() => { loadText.textContent = 'Loading core modules...'; }, 1000);
        setTimeout(() => { loadText.textContent = 'Almost ready...'; }, 3000);
    }
})();
</script>
