    <!-- iOS 真实视口高度修正 + 壁纸同步到 html 兜底层 -->
    <script>
        (function() {
            var root = document.documentElement;

            function isStandalone() {
                return window.navigator.standalone === true ||
                    window.matchMedia('(display-mode: standalone)').matches;
            }

            // 主屏幕模式下 innerHeight 会少算状态栏高度，改取物理屏幕高度
            function setAppHeight() {
                var h = window.innerHeight;
                if (isStandalone()) {
                    var landscape = window.innerWidth > window.innerHeight;
                    var screenH = landscape
                        ? Math.min(screen.width, screen.height)
                        : Math.max(screen.width, screen.height);
                    h = Math.max(h, screenH);
                }
                root.style.setProperty('--app-height', h + 'px');
            }

            // 把 phone-container 上的壁纸变量复制到 html，让 html 背景层也显示壁纸
            var lastBg = '';
            function syncWallpaper() {
                var pc = document.getElementById('phoneContainer');
                if (!pc) return;
                var bg = getComputedStyle(pc).getPropertyValue('--wallpaper-bg').trim();
                if (bg && bg !== lastBg) {
                    lastBg = bg;
                    root.style.setProperty('--wallpaper-bg-root', bg);
                }
            }

            setAppHeight();
            window.addEventListener('resize', setAppHeight);
            window.addEventListener('orientationchange', function() {
                setTimeout(setAppHeight, 300);
            });

            document.addEventListener('DOMContentLoaded', function() {
                setAppHeight();
                syncWallpaper();
                var pc = document.getElementById('phoneContainer');
                var observer = new MutationObserver(syncWallpaper);
                if (pc) {
                    observer.observe(pc, { attributes: true, attributeFilter: ['style', 'class'] });
                }
                observer.observe(document.body, { attributes: true, attributeFilter: ['style', 'class'] });
                // 壁纸可能由异步脚本稍后写入，再补几次同步
                setTimeout(syncWallpaper, 500);
                setTimeout(syncWallpaper, 1500);
                setTimeout(syncWallpaper, 3000);
            });
        })();
    </script>

    <script>
        // 记录已经注入过的文件，重复调用时跳过，避免 "already declared" 报错
        window.__loadedCoreScripts = window.__loadedCoreScripts || new Set();

        window.__appBootstrap = async function(token) {
            const scripts = [
                'js/db.js',
                'js/desktop.js',
                'js/apps/settings.js',
                'js/apps/quick-cruise.js',
                'js/apps/messages-api.js',
                'js/apps/messages-markup.js',
                'js/apps/messages.js',
                'js/apps/archangel.js',
                'js/apps/worldbook.js',
                'js/apps/world.js',
                'js/liquid-glass.js',
                'js/apps/preset.js',
                'js/apps/backup.js',
                'js/apps/app-manager.js',
                'js/main.js'
            ];

            // 网络抖动时自动重试，最多 3 次，每次间隔递增
            async function fetchWithRetry(url, times) {
                let lastErr = null;
                for (let i = 0; i < times; i++) {
                    try {
                        return await fetch(url, { cache: 'no-store' });
                    } catch (e) {
                        lastErr = e;
                        console.warn('[Core] Request failed, retrying…', i + 1, url);
                        await new Promise(r => setTimeout(r, 800 * (i + 1)));
                    }
                }
                throw lastErr;
            }

            // 受保护的样式：顺序与原来 <link> 的顺序保持一致，后面的会覆盖前面的
            const styles = [
                'css/base.css',
                'css/desktop.css',
                'css/app-icon.css',
                'css/widgets.css',
                'css/app-window.css',
                'css/settings.css',
                'css/messages.css',
                'css/archangel.css',
                'css/worldbook.css',
                'css/preset.css',
                'css/world.css',
                'css/liquid-glass.css',
                'css/backup.css',
                'css/widget-kit.css'
            ];

            for (const href of styles) {
                if (window.__loadedCoreScripts.has(href)) continue;

                const cssUrl = `/api/protected-js?file=${encodeURIComponent(href)}&token=${encodeURIComponent(token)}`;
                const cssRes = await fetchWithRetry(cssUrl, 3);

                if (!cssRes.ok) {
                    const detail = await cssRes.text();
                    console.warn('[Style] Blocked, fallback to public file…', href, cssRes.status, detail.slice(0, 120));
                    // 后端没放行时，退回公开的 css 文件，保证页面有样式
                    const link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.href = href;
                    link.dataset.src = href;
                    document.head.appendChild(link);
                    window.__loadedCoreScripts.add(href);
                    continue;
                }

                let css = await cssRes.text();
                // 原文件在 css/ 目录下，url('../assets/...') 内联到页面后要改成 url('assets/...')
                css = css.replace(/url\(\s*(['"]?)\.\.\//g, 'url($1');

                const style = document.createElement('style');
                style.dataset.src = href;
                style.textContent = css;
                document.head.appendChild(style);
                window.__loadedCoreScripts.add(href);
                console.log('[Style] Injected…', href, 'size =', css.length);
            }

            let injectedCount = 0;

            for (const src of scripts) {
                if (window.__loadedCoreScripts.has(src)) {
                    console.log('[Core] Already loaded, skipping…', src);
                    continue;
                }

                const url = `/api/protected-js?file=${encodeURIComponent(src)}&token=${encodeURIComponent(token)}`;
                const response = await fetchWithRetry(url, 3);

                if (!response.ok) {
                    const detail = await response.text();
                    const err = new Error(`${src} 返回 ${response.status}：${detail.slice(0, 120)}`);
                    err.status = response.status;
                    throw err;
                }

                const code = await response.text();
                const script = document.createElement('script');
                script.textContent = code;
                document.head.appendChild(script);
                window.__loadedCoreScripts.add(src);
                injectedCount++;
                console.log('[Core] Injected…', src, 'size =', code.length);
            }

            // 核心脚本是页面加载完之后才注入的，DOMContentLoaded 和 load 早已触发过。
            // main.js 等文件注册的初始化监听不会自动执行，这里手动派发一次真实事件。
            // 只在本次确实注入了新文件时派发，避免重复初始化。
            if (injectedCount > 0 && !window.__coreInitDispatched) {
                window.__coreInitDispatched = true;
                console.log('[Core] Booting desktop…');
                document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true }));
                window.dispatchEvent(new Event('load'));
                console.log('[Core] Boot events dispatched…');
            }
        };
    </script>
