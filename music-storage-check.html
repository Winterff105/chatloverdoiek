<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self' https://tjgxfyblzgqwxwfwvfol.supabase.co; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; object-src 'none'; form-action 'none'; frame-ancestors 'none'">
<title>音乐源码管理 · Whatever</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#09090b;color:#ededf0;font:13px/1.7 system-ui,-apple-system,sans-serif;padding:20px;text-align:center}
#state{max-width:360px;color:#a1a1ad}a{color:#d5bbcc}
</style>
</head>
<body>
<p id="state" role="status" aria-live="polite">正在从 Supabase 载入音乐源码管理界面…</p>
<script>
(async function(){
  const state=document.getElementById('state');
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),18000);
  try{
    const url='https://tjgxfyblzgqwxwfwvfol.supabase.co/functions/v1/cherie-music-admin-ui';
    const response=await fetch(url,{method:'GET',credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',signal:controller.signal});
    if(!response.ok)throw Error('Supabase 响应 '+response.status);
    const html=await response.text();
    if(!/^\s*<!doctype html>/i.test(html)||!html.includes('id="wmc-admin-chat-source"')||
       !html.includes('id="wmc-admin-runtime-source"')||!html.includes('/api/music-storage-admin'))
      throw Error('Supabase 返回的管理页面不完整');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    state.textContent='音乐源码管理暂时无法加载：'+String(error?.message||error)+'。请检查 Supabase Edge Function cherie-music-admin-ui。';
  }finally{clearTimeout(timeout);}
})();
</script>
</body>
</html>
