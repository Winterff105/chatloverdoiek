# One-time owner-approved cleanup. Each branch head is pinned and
# must be an ancestor of main; changed or unmerged heads are never deleted.
name: Retire fully merged historical branches
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  prune:
    if: "${{ startsWith(github.event.head_commit.message, 'chore: retire merged historical branches') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove only verified merged branch refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while read -r branch expected; do
            if [ -z "$branch" ] || [ "$branch" = "main" ]; then continue; fi
            current="$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq '.commit.sha')"
            if [ "$current" != "$expected" ]; then
              echo "Branch moved; refusing to delete $branch"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$current" HEAD; then
              echo "Unmerged history; refusing to delete $branch"
              exit 1
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Retired $branch"
          done <<'BRANCHES'
          feat/guarded-private-music-storage-maintenance 5f15a87d1719b9bfa0d2052bc445e881c1e91f15
          feat/music-custom-char-dropdown-compact-v22-20261028 796531773eb8d1414d99881cc92395061bb11dd8
